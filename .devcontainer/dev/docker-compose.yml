name: ${COMPOSE_PROJECT_NAME}

services:
  animated-route:
    image: ${COMPOSE_PROJECT_NAME}-app
    hostname: app
    container_name: ${COMPOSE_PROJECT_NAME}-App
    build:
      context: ..
      dockerfile: Dockerfile.app
    working_dir: /app
    restart: always
    env_file:
      - .env
    volumes:
      - ../../:/app
      - ./cmd-animated-route.sh:/tmp/app/cmd-animated-route.sh
      - /var/run/docker.sock:/var/run/docker.sock
      - node_modules:/app/node_modules
    # ports:
    networks:
      npm-network:

volumes:
  node_modules:

networks:
  npm-network:
    external: true
