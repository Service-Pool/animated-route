name: ${COMPOSE_PROJECT_NAME}

services:
  animated-route:
    image: ${COMPOSE_PROJECT_NAME}-app
    hostname: app
    container_name: ${COMPOSE_PROJECT_NAME}-App
    build:
      context: ..
      dockerfile: Dockerfile.app
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../../:/app
      - ./cmd-animated-route.sh:/tmp/app/cmd-animated-route.sh
      - /var/run/docker.sock:/var/run/docker.sock
      - node_modules:/app/node_modules
    # ports:
    # - 8080:80
    healthcheck:
      test: ["CMD", "test", "-S", "/run/supervisor.sock"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      npm-network:

volumes:
  node_modules:

networks:
  npm-network:
    external: true
